[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerospace-engineering-ai999x"
version = "1.0.2"
description = "Offline aerospace engineering solver: the standard atmosphere, airspeeds, compressible flow and shocks, nozzles and rocket engines, rocket performance and staging, aircraft performance, stability, propellers, wings, orbits and re-entry, with steps, LaTeX and honest refusals"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Ibnul Jaif Farabi"}]
maintainers = [{name = "AI999X"}]
keywords = ["aerospace engineering", "aeronautics", "astronautics", "standard atmosphere", "compressible flow", "shock waves", "rocket propulsion", "aircraft performance", "orbital mechanics", "ai999x", "offline", "cpu", "stem", "education", "step-by-step", "latex", "solver"]
classifiers = ["License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Operating System :: OS Independent", "Intended Audience :: Education", "Intended Audience :: Science/Research", "Intended Audience :: Developers", "Topic :: Scientific/Engineering", "Topic :: Education", "Development Status :: 5 - Production/Stable"]
dependencies = ["sympy>=1.12", "mpmath>=1.3"]

[project.optional-dependencies]
search = ["onnxruntime>=1.17", "tokenizers>=0.15", "numpy>=1.24"]
plot = ["matplotlib>=3.7"]
all = ["matplotlib>=3.7", "numpy>=1.24", "onnxruntime>=1.17", "tokenizers>=0.15"]
reader = ["onnxruntime>=1.17", "tokenizers>=0.15", "numpy>=1.24"]

[project.scripts]
aerospace-engineering-ai999x = "aerospace_engineering_ai999x.cli:main"

[project.urls]
"Source" = "https://github.com/AI999X/aerospace-engineering-ai999x"
"Issues" = "https://github.com/AI999X/aerospace-engineering-ai999x/issues"
"Homepage" = "https://ai999x.com"
"Hugging Face" = "https://huggingface.co/AI999X/aerospace-engineering-ai999x"
"Funding" = "https://buymeacoffee.com/ibnuljaiffarabi"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aerospace_engineering_ai999x = ["pack/*.json", "pack/*/*.json", "pack/*.sqlite", "pack/capabilities/*.py", "pack/search/*.onnx", "pack/reader/*.onnx"]
